plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // EMI
    modImplementation "dev.emi:emi-fabric:${emi_version}"

    // JEI
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_TOKEN") ?: "0"
    project {
        id = "1420447"
        releaseType = "release"
        changelog = file('../CHANGELOG.md')
        changelogType = 'markdown'

        addGameVersion "1.20.1"
        addGameVersion "Java 17"
        addGameVersion "Fabric"

        mainArtifact(remapJar) {
            displayName = "Reliable Remover Fabric ${project.minecraft_version} - ${project.version}"
        }

        relations {
            requiredDependency "fabric-api"
            optionalDependency "reliable-recipes"
            optionalDependency "emi"
            optionalDependency "jei"
            optionalDependency "cloth-config"
        }
    }
    options {
        forgeGradleIntegration = false
    }
}
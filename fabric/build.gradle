plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
 

    // EMI
    implementation("cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}+${minecraft_version}")

    // JEI
    compileOnly "mezz.jei:jei-1.21.11-neoforge:${jei_version}"

    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${mod_menu_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file = tasks.named("jar").flatMap { it.archiveFile }
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE
    displayName = "${mod_name} Fabric ${minecraft_version} - ${project.version}"
    modLoaders.add("fabric")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1420447"
        minecraftVersions.add("26.1-snapshot")

        optional { slug = "reliable-recipes" }
        optional { slug = "rrv" }
        optional { slug = "jei" }
        optional { slug = "cloth-config" }
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "pLxsKvNt"
        minecraftVersions.add("26.1-snapshot-4")

        optional { slug = "reliable-recipes" }
        optional { slug = "rrv" }
        optional { slug = "jei" }
        optional { slug = "cloth-config" }
    }
}
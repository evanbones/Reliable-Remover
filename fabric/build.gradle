plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "com.matthewprenger.cursegradle" version "1.4.0"
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    // EMI
    modImplementation "dev.emi:emi-fabric:${emi_version}"

    // JEI
    modImplementation "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_TOKEN") ?: "0"
    project {
        id = "1420447"
        releaseType = "release"
        changelog = file('../CHANGELOG.md')
        changelogType = 'markdown'

        addGameVersion "1.21.1"
        addGameVersion "Java 21"
        addGameVersion "Fabric"

        mainArtifact(remapJar.archiveFile) {
            displayName = "Reliable Remover Fabric ${project.minecraft_version} - ${project.version}"
        }

        relations {
            requiredDependency "fabric-api"
            optionalDependency "reliable-recipes"
            optionalDependency "emi"
            optionalDependency "jei"
            optionalDependency "cloth-config"
        }
    }
    options {
        forgeGradleIntegration = false
    }
}
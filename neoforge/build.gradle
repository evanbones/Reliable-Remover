plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // EMI
    implementation "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "maven.modrinth:emi-loot:${emi_loot_version}+neoforge"
    implementation "maven.modrinth:just-enough-effect-descriptions-jeed:${jeed_version_neoforge}"

    // Reliable Recipes
    implementation "maven.modrinth:reliable-recipes:${reliable_recipes_version}-neoforge"

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Clutter No More
    compileOnly "maven.modrinth:clutter-no-more:${cnm_version}-neoforge"
    runtimeOnly "maven.modrinth:clutter-no-more:${cnm_version}-neoforge"

    // YACL
    implementation "maven.modrinth:yacl:${yacl_version}-neoforge"
}

publishMods {
    file = tasks.named("jar").flatMap { it.archiveFile }
}
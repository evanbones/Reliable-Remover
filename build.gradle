plugins {
    id 'net.fabricmc.fabric-loom' version '1.14-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.139' apply false
    id 'org.moddedmc.wiki.toolkit' version '0.4.1'
}

subprojects {
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

wiki {
    docs.create("reliable-remover") {
        root = file("docs/")
    }
}